# Builds the EPIC image (Dockerfile) and publishes it to the GitHub Container
# Registry, from which the imaging nodes' Nomad jobs pull it:
#   ghcr.io/epic-astronomy/lwa-epic
# Tags: the branch name, sha-<short sha> for every commit, latest for phoenix,
# and the version for a v* tag. Pull requests are built but not published.
# The CUDA build takes most of an hour on a hosted runner; the layer cache
# keeps rebuilds that change only Python sources to minutes.
name: images

on:
  push:
    branches: [phoenix, phoenix-fx]
    tags: ['v*']
  pull_request:
    branches: [phoenix]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the CUDA images and the build need more room than a hosted runner leaves
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lwa-epic
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/phoenix' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=lwa-epic
          cache-to: type=gha,mode=max,scope=lwa-epic
