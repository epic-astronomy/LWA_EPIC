<!DOCTYPE html>

    .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }

      <desc id="pipeline-overview-desc">On each imaging node the packet receiver assembles NDP F-engine packets into gulps, the GPU imager forms all-sky images by E-field gridding or the FX route, and the images feed FITS integrations, database pixels, video and the all-sky monitor, while the streamcal daemon closes a calibration loop through visibility and gain tables.</desc>
