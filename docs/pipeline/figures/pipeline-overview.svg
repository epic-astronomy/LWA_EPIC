<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-overview-title pipeline-overview-desc" id="pipeline-overview-root">
      <title id="pipeline-overview-title">The EPIC imaging pipeline</title>
      <desc id="pipeline-overview-desc">On each imaging node the packet receiver assembles NDP F-engine packets into gulps, the GPU imager forms all-sky images by E-field gridding or the FX route, and the images feed FITS integrations, database pixels, video and the all-sky monitor, while the streamcal daemon closes a calibration loop through visibility and gain tables.</desc>
      <defs>
      <style>#pipeline-overview-root { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #111827; }
      #pipeline-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-overview-root .diagram-container { overflow-x: visible; }
      #pipeline-overview-root .nm { font: 600 12px 'DM Sans', ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      #pipeline-overview-root .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
      #pipeline-overview-root .tg { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #6b7280; }
      #pipeline-overview-root .tgf { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #15803d; }
      #pipeline-overview-root .lb { font: 400 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #6b7280; }
      #pipeline-overview-root .ey { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #6b7280; }
      #pipeline-overview-root .co { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4b5563; }</style>
