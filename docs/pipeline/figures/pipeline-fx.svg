      <rect x="640" y="120" width="224" height="64" rx="6" fill="#ffffff"/>
      <rect x="640" y="120" width="224" height="64" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="1.2" fill-opacity="0.08"/>
      <rect x="648" y="126" width="28" height="12" rx="2" fill="none" stroke="#15803d" stroke-width="0.8" stroke-opacity="0.50"/>
