      <text x="848" y="314" class="sb" text-anchor="middle">streamcal · versioned</text>
      <rect x="912" y="120" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="912" y="120" width="144" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
