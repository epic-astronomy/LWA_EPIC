      <text x="752" y="154" class="nm" text-anchor="middle">Tiled lag gridder</text>
      <text x="752" y="170" class="sb" text-anchor="middle">1/weight · gains · w-proj</text>
      <rect x="576" y="264" width="144" height="64" rx="6" fill="#ffffff"/>
