<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-fx-title pipeline-fx-desc" id="pipeline-fx-root">
      <title id="pipeline-fx-title">The FX imaging path</title>
      <desc id="pipeline-fx-desc">The Tensor-Core Correlator correlates the voltages and the sample weights of every gulp; once per image the tiled lag gridder normalises each visibility by its valid samples, applies the calibration gains and optionally subtracts peeled sources, then an inverse FFT and a combine step form the XX, YY and cross-polarisation images.</desc>
      <defs>
      <style>#pipeline-fx-root { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #111827; }
      #pipeline-fx-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-fx-root .diagram-container { overflow-x: visible; }
      #pipeline-fx-root .nm { font: 600 12px 'DM Sans', ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      #pipeline-fx-root .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
      #pipeline-fx-root .tg { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #6b7280; }
      #pipeline-fx-root .tgf { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #15803d; }
      #pipeline-fx-root .lb { font: 400 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #6b7280; }
      #pipeline-fx-root .ey { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #6b7280; }
      #pipeline-fx-root .co { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4b5563; }</style>
        <marker id="pipeline-fx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="pipeline-fx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15803d"/></marker>
        <marker id="pipeline-fx-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="16" y="88" width="448" height="272" rx="8" fill="#111827" stroke="#111827" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
