      <text x="276" y="135" class="tg" text-anchor="middle">TCC</text>
      <text x="344" y="154" class="nm" text-anchor="middle">Correlate voltages</text>
      <text x="344" y="170" class="sb" text-anchor="middle">int8 · sums the gulps</text>
      <rect x="256" y="264" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="256" y="264" width="176" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <rect x="264" y="270" width="24" height="12" rx="2" fill="none" stroke="#111827" stroke-width="0.8" stroke-opacity="0.40"/>
