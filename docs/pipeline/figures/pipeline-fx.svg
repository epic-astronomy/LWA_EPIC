      <text x="1176" y="154" class="nm" text-anchor="middle">Combine</text>
      <text x="1176" y="170" class="sb" text-anchor="middle">XX YY XY* · copy</text>
      <text x="32" y="400" class="co">Each visibility is scaled by the image length over its valid samples before gridding,</text>
      <text x="32" y="418" class="co">so lost packets lower the sensitivity of a baseline but not its amplitude.</text>
