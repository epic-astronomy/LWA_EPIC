      <rect x="928" y="88" width="336" height="128" rx="8" fill="#111827" stroke="#111827" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="940" y="92" width="76" height="12" rx="2" fill="#ffffff"/>
      <text x="978" y="101" class="ey" text-anchor="middle">IMAGING GPU</text>
