        <marker id="pipeline-receiver-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15803d"/></marker>
        <marker id="pipeline-receiver-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="192" y="88" width="528" height="128" rx="8" fill="#111827" stroke="#111827" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="204" y="92" width="164" height="12" rx="2" fill="#ffffff"/>
