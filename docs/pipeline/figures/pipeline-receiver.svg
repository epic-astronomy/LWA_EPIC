<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-receiver-title pipeline-receiver-desc" id="pipeline-receiver-root">
      <title id="pipeline-receiver-title">Packet receiver and gulp assembly</title>
      <desc id="pipeline-receiver-desc">A NIC poller thread hands packet batches through a single-producer single-consumer ring to an assembler thread that writes time-major gulps and a validity mask; the GPU transposes each gulp to channel-major order and zeroes the samples of lost packets before imaging.</desc>
      <defs>
      <style>#pipeline-receiver-root { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #111827; }
      #pipeline-receiver-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-receiver-root .diagram-container { overflow-x: visible; }
      #pipeline-receiver-root .nm { font: 600 12px 'DM Sans', ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      #pipeline-receiver-root .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
      #pipeline-receiver-root .tg { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #6b7280; }
      #pipeline-receiver-root .tgf { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #15803d; }
      #pipeline-receiver-root .lb { font: 400 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #6b7280; }
      #pipeline-receiver-root .ey { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #6b7280; }
      #pipeline-receiver-root .co { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4b5563; }</style>
