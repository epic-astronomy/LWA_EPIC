<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skymon-tiers-title skymon-tiers-desc" id="skymon-tiers-root">
      <title id="skymon-tiers-title">Octave tiers of the dedispersion search</title>
      <desc id="skymon-tiers-desc">Seven search tiers, each averaging twice as many images as the one before, cover DM 0 to 5092 pc cm-3 at 57.4 MHz in octaves, with the configured limit at DM 3000 and reporting latencies from 21 s to 171 s.</desc>
