      <style>#skymon-tiers-root { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #111827; }
      #skymon-tiers-root .diagram-container { width: 100%; overflow-x: auto; }
      #skymon-tiers-root .diagram-container { overflow-x: visible; }
      #skymon-tiers-root .nm { font: 600 12px 'DM Sans', ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      #skymon-tiers-root .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
      #skymon-tiers-root .tg { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #6b7280; }
      #skymon-tiers-root .tgf { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #15803d; }
      #skymon-tiers-root .lb { font: 400 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #6b7280; }
      #skymon-tiers-root .ey { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #6b7280; }
      #skymon-tiers-root .co { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4b5563; }
      #skymon-tiers-root .ink { fill: #111827; }</style>
