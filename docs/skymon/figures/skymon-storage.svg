<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skymon-storage-title skymon-storage-desc" id="skymon-storage-root">
      <title id="skymon-storage-title">Storage, mailbox and failure handling</title>
      <desc id="skymon-storage-desc">Each imaging node keeps its records in a local PostgreSQL database that serves as the mailbox between monitor and combiner, spools records on local disk while the database is down, receives versioned event copies from the combiner, and archives kept events to the shared file system through a separate archiver that waits when the archive is absent.</desc>
      <defs>
      <style>#skymon-storage-root { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #111827; }
      #skymon-storage-root .diagram-container { width: 100%; overflow-x: auto; }
      #skymon-storage-root .diagram-container { overflow-x: visible; }
      #skymon-storage-root .nm { font: 600 12px 'DM Sans', ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      #skymon-storage-root .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
      #skymon-storage-root .tg { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #6b7280; }
      #skymon-storage-root .tgf { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #15803d; }
      #skymon-storage-root .lb { font: 400 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #6b7280; }
      #skymon-storage-root .ey { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #6b7280; }
      #skymon-storage-root .co { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4b5563; }</style>
