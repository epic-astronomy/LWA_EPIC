<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="streamcal-loop-title streamcal-loop-desc" id="streamcal-loop-root">
      <title id="streamcal-loop-title">The streaming calibration loop</title>
      <desc id="streamcal-loop-desc">The imager's GPU tap publishes a visibility table every 10 s; the streamcal daemon solves and publishes a relative gain table, which the imager applies at the next image boundary, and a calibration record that the all-sky monitor uses with the images' gain_version to set the flux scale.</desc>
      <defs>
      <style>#streamcal-loop-root { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #111827; }
      #streamcal-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #streamcal-loop-root .diagram-container { overflow-x: visible; }
      #streamcal-loop-root .nm { font: 600 12px 'DM Sans', ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      #streamcal-loop-root .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
      #streamcal-loop-root .tg { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #6b7280; }
      #streamcal-loop-root .tgf { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #15803d; }
      #streamcal-loop-root .lb { font: 400 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #6b7280; }
      #streamcal-loop-root .ey { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #6b7280; }
      #streamcal-loop-root .co { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4b5563; }</style>
        <marker id="streamcal-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="streamcal-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15803d"/></marker>
        <marker id="streamcal-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="32" y="88" width="1216" height="120" rx="8" fill="#111827" stroke="#111827" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
