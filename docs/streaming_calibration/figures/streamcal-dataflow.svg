<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="streamcal-dataflow-title streamcal-dataflow-desc" id="streamcal-dataflow-root">
      <title id="streamcal-dataflow-title">Streaming calibration data flow</title>
      <desc id="streamcal-dataflow-desc">The imager's tap averages visibilities over 10 s; the streamcal daemon solves them against a sky model, tracks the gains over time and publishes a gain table, which the imager applies from the next image, and a calibration record that the all-sky monitor uses for the flux scale.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #streamcal-dataflow-root { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #111827; }
      #streamcal-dataflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #streamcal-dataflow-root .diagram-container { overflow-x: visible; }
      #streamcal-dataflow-root .nm { font: 600 12px 'DM Sans', ui-sans-serif, system-ui, sans-serif; fill: #111827; }
      #streamcal-dataflow-root .sb { font: 400 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4b5563; }
      #streamcal-dataflow-root .tg { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #6b7280; }
      #streamcal-dataflow-root .tgf { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; fill: #15803d; }
      #streamcal-dataflow-root .lb { font: 400 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; fill: #6b7280; }
      #streamcal-dataflow-root .ey { font: 500 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.14em; fill: #6b7280; }
      #streamcal-dataflow-root .co { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4b5563; }</style>
        <marker id="streamcal-dataflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="streamcal-dataflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15803d"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- the daemon -->
      <rect x="352" y="260" width="896" height="136" rx="8" fill="#111827" stroke="#111827" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
      <rect x="364" y="264" width="176" height="12" rx="2" fill="#ffffff"/>
      <text x="452" y="273" class="ey" text-anchor="middle">STREAMCAL DAEMON · EVERY TABLE</text>

      <!-- arrows (before boxes) -->
      <path d="M 288,152 H 600" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <rect x="408" y="130" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="444" y="139" class="lb" text-anchor="middle">VISIBILITIES</text>

      <path d="M 688,184 V 300" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <rect x="698" y="226" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="730" y="235" class="lb" text-anchor="middle">EVERY 10 S</text>

      <path d="M 552,332 H 600" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <path d="M 776,332 H 824" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <path d="M 1000,332 H 1048" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>

      <path d="M 1136,300 V 184" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <rect x="1146" y="226" width="48" height="12" rx="2" fill="#ffffff"/>
      <text x="1170" y="235" class="lb" text-anchor="middle">PUBLISH</text>

      <path d="M 1136,364 V 456" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <rect x="1146" y="404" width="44" height="12" rx="2" fill="#ffffff"/>
      <text x="1168" y="413" class="lb" text-anchor="middle">RECORD</text>

      <path d="M 1136,120 V 64 Q 1136,56 1128,56 H 184 Q 176,56 176,64 V 120" fill="none" stroke="#15803d" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow-accent)"/>
      <rect x="616" y="34" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="656" y="43" class="lb" text-anchor="middle" style="fill:#15803d">NEXT IMAGE</text>

      <path d="M 1048,488 H 776" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <rect x="880" y="466" width="64" height="12" rx="2" fill="#ffffff"/>
      <text x="912" y="475" class="lb" text-anchor="middle">FLUX SCALE</text>

      <path d="M 176,184 V 480 Q 176,488 184,488 H 600" fill="none" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <rect x="350" y="466" width="76" height="12" rx="2" fill="#ffffff"/>
      <text x="388" y="475" class="lb" text-anchor="middle">GAIN_VERSION</text>

      <!-- imager -->
      <rect x="64" y="120" width="224" height="64" rx="6" fill="#ffffff"/>
      <rect x="64" y="120" width="224" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <rect x="72" y="126" width="24" height="12" rx="2" fill="none" stroke="#111827" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="84" y="135" class="tg" text-anchor="middle">GPU</text>
      <text x="176" y="154" class="nm" text-anchor="middle">epic++ imager</text>
      <text x="176" y="170" class="sb" text-anchor="middle">TCC tap · applies the gains</text>

      <!-- visibility table -->
      <rect x="600" y="120" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="600" y="120" width="176" height="64" rx="6" fill="#111827" stroke="#4b5563" stroke-width="1" fill-opacity="0.05"/>
      <rect x="608" y="126" width="24" height="12" rx="2" fill="none" stroke="#4b5563" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="620" y="135" class="tg" text-anchor="middle">SHM</text>
      <text x="688" y="154" class="nm" text-anchor="middle">Visibility table</text>
      <text x="688" y="170" class="sb" text-anchor="middle">10 s average · 192 ch</text>

      <!-- gain table -->
      <rect x="1048" y="120" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="1048" y="120" width="176" height="64" rx="6" fill="#111827" stroke="#4b5563" stroke-width="1" fill-opacity="0.05"/>
      <rect x="1056" y="126" width="24" height="12" rx="2" fill="none" stroke="#4b5563" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="1068" y="135" class="tg" text-anchor="middle">SHM</text>
      <text x="1136" y="154" class="nm" text-anchor="middle">Gain table</text>
      <text x="1136" y="170" class="sb" text-anchor="middle">gains x weights · projector</text>

      <!-- daemon steps -->
      <rect x="376" y="300" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="376" y="300" width="176" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <rect x="384" y="306" width="12" height="12" rx="2" fill="none" stroke="#111827" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="390" y="315" class="tg" text-anchor="middle">1</text>
      <text x="464" y="334" class="nm" text-anchor="middle">Sky model</text>
      <text x="464" y="350" class="sb" text-anchor="middle">A-team, Sun, diffuse · beam</text>

      <rect x="600" y="300" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="600" y="300" width="176" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <rect x="608" y="306" width="12" height="12" rx="2" fill="none" stroke="#111827" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="614" y="315" class="tg" text-anchor="middle">2</text>
      <text x="688" y="334" class="nm" text-anchor="middle">Solve per channel</text>
      <text x="688" y="350" class="sb" text-anchor="middle">flags · RFI · StEFCal</text>

      <rect x="824" y="300" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="824" y="300" width="176" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <rect x="832" y="306" width="12" height="12" rx="2" fill="none" stroke="#111827" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="838" y="315" class="tg" text-anchor="middle">3</text>
      <text x="912" y="334" class="nm" text-anchor="middle">Track over time</text>
      <text x="912" y="350" class="sb" text-anchor="middle">Kalman · weights · scale</text>

      <rect x="1048" y="300" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="1048" y="300" width="176" height="64" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="1.2" fill-opacity="0.08"/>
      <rect x="1056" y="306" width="12" height="12" rx="2" fill="none" stroke="#15803d" stroke-width="0.8" stroke-opacity="0.50"/>
      <text x="1062" y="315" class="tgf" text-anchor="middle">4</text>
      <text x="1136" y="334" class="nm" text-anchor="middle">Publish policy</text>
      <text x="1136" y="350" class="sb" text-anchor="middle">hold 5 min · then &lt;= 1/min</text>

      <!-- record and monitor -->
      <rect x="1048" y="456" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="1048" y="456" width="176" height="64" rx="6" fill="#111827" stroke="#4b5563" stroke-width="1" fill-opacity="0.05"/>
      <rect x="1056" y="462" width="28" height="12" rx="2" fill="none" stroke="#4b5563" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="1070" y="471" class="tg" text-anchor="middle">JSON</text>
      <text x="1136" y="490" class="nm" text-anchor="middle">Calibration record</text>
      <text x="1136" y="506" class="sb" text-anchor="middle">absolute scale · calibrators</text>

      <rect x="600" y="456" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="600" y="456" width="176" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <rect x="608" y="462" width="20" height="12" rx="2" fill="none" stroke="#111827" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="618" y="471" class="tg" text-anchor="middle">PY</text>
      <text x="688" y="490" class="nm" text-anchor="middle">skymon monitor</text>
      <text x="688" y="506" class="sb" text-anchor="middle">rebase · fluences</text>

      <text x="32" y="568" class="co">The gains are relative and change only when a table is published: once the solution has converged, then at most once a minute.</text>
      <line x1="32" y1="592" x2="1248" y2="592" stroke="#111827" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="32" y="620" class="ey">LEGEND</text>
      <rect x="96" y="610" width="20" height="12" rx="2" fill="#22c55e" stroke="#15803d" stroke-width="1" fill-opacity="0.08"/>
      <text x="124" y="619" class="lb">FOCAL STEP</text>
      <rect x="204" y="610" width="20" height="12" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <text x="232" y="619" class="lb">PROCESS OR STEP</text>
      <rect x="348" y="610" width="20" height="12" rx="2" fill="#111827" stroke="#4b5563" stroke-width="1" fill-opacity="0.05"/>
      <text x="376" y="619" class="lb">SHARED FILE</text>
      <line x1="460" y1="616" x2="492" y2="616" stroke="#4b5563" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow)"/>
      <text x="500" y="619" class="lb">DATA</text>
      <line x1="549" y1="616" x2="581" y2="616" stroke="#15803d" stroke-width="1.2" marker-end="url(#streamcal-dataflow-arrow-accent)"/>
      <text x="589" y="619" class="lb">FEEDBACK</text>
    </svg>
